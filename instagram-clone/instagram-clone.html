<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Clone</title>
    <!-- FontAwesome for Instagram Icons -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        /* --- RESET & GLOBAL STYLES --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #000000;
            color: #f5f5f5;
            display: flex;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* --- SIDEBAR NAVIGATION --- */
        .sidebar {
            width: 245px;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            border-right: 1px solid #262626;
            padding: 25px 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background-color: #000000;
        }

        .logo-container {
            padding: 12px;
            margin-bottom: 20px;
        }

        .logo-container h1 {
            font-family: 'Style Script', cursive, sans-serif; /* fallback */
            font-size: 24px;
            font-weight: bold;
            font-style: italic;
        }

        .nav-links {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .nav-item a {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 12px;
            font-size: 16px;
            border-radius: 8px;
            transition: background 0.2s ease;
        }

        .nav-item a:hover {
            background-color: #1a1a1a;
        }

        .nav-item i {
            font-size: 22px;
            width: 24px;
            text-align: center;
        }

        /* --- MAIN CONTENT CONTAINER --- */
        .main-container {
            margin-left: 245px;
            width: calc(100% - 245px);
            display: flex;
            justify-content: center;
            padding-top: 30px;
        }

        .feed-container {
            width: 100%;
            max-width: 630px;
            padding: 0 20px;
        }

        /* --- STORIES SECTION --- */
        .stories-bar {
            display: flex;
            gap: 16px;
            padding: 16px 0;
            overflow-x: auto;
            margin-bottom: 20px;
        }

        .stories-bar::-webkit-scrollbar {
            display: none; /* Hide scrollbar for clean look */
        }

        .story-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            font-size: 12px;
            color: #a8a8a8;
            min-width: 66px;
        }

        .story-img-wrapper {
            width: 66px;
            height: 66px;
            border-radius: 50%;
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 6px;
        }

        .story-card img {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 3px solid #000000;
            object-fit: cover;
        }

        .story-username {
            max-width: 66px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* --- POST FEED SECTION --- */
        .post {
            border-bottom: 1px solid #262626;
            padding-bottom: 20px;
            margin-bottom: 24px;
        }

        /* Post Header */
        .post-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
        }

        .post-user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .post-user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
        }

        .post-username {
            font-size: 14px;
            font-weight: 600;
        }

        .post-time {
            font-size: 14px;
            color: #a8a8a8;
        }

        .post-header-more {
            cursor: pointer;
            color: #f5f5f5;
        }

        /* Post Content Image */
        .post-image-container {
            width: 100%;
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid #262626;
            background-color: #121212;
        }

        .post-image-container img {
            width: 100%;
            height: auto;
            display: block;
            max-height: 585px;
            object-fit: cover;
        }

        /* Post Actions & Buttons */
        .post-actions {
            display: flex;
            justify-content: space-between;
            padding: 12px 0 8px 0;
        }

        .action-left {
            display: flex;
            gap: 16px;
        }

        .post-actions i {
            font-size: 24px;
            cursor: pointer;
            transition: color 0.1s;
        }

        .post-actions i:hover {
            color: #a8a8a8;
        }

        .fa-heart:hover {
            color: #ff3040;
        }

        /* Post Text Details */
        .post-details {
            font-size: 14px;
            line-height: 18px;
        }

        .likes-count {
            font-weight: 600;
            margin-bottom: 6px;
            display: block;
        }

        .caption-text {
            margin-bottom: 6px;
        }

        .caption-username {
            font-weight: 600;
            margin-right: 6px;
        }

        .view-comments {
            color: #a8a8a8;
            cursor: pointer;
            margin-bottom: 4px;
        }

        /* --- RESPONSIVE LAYOUT --- */
        @media (max-width: 768px) {
            .sidebar {
                width: 72px;
                padding: 25px 0;
                align-items: center;
            }
            .logo-container h1 {
                display: none;
            }
            .logo-container::before {
                content: "\f16d"; /* FontAwesome Instagram Logo icon */
                font-family: "Font Awesome 6 Brands";
                font-size: 24px;
            }
            .nav-item span {
                display: none;
            }
            .main-container {
                margin-left: 72px;
                width: calc(100% - 72px);
            }
        }
    </style>
</head>
<body>

    <!-- SIDEBAR NAVIGATION -->
    <nav class="sidebar">
        <div>
            <div class="logo-container">
                <h1>Instagram</h1>
            </div>
            <ul class="nav-links">
                <li class="nav-item"><a href="#"><i class="fa-solid fa-house"></i> <span>Home</span></a></li>
                <li class="nav-item"><a href="#"><i class="fa-solid fa-magnifying-glass"></i> <span>Search</span></a></li>
                <li class="nav-item"><a href="#"><i class="fa-regular fa-compass"></i> <span>Explore</span></a></li>
                <li class="nav-item"><a href="#"><i class="fa-solid fa-clapperboard"></i> <span>Reels</span></a></li>
                <li class="nav-item"><a href="#"><i class="fa-regular fa-paper-plane"></i> <span>Messages</span></a></li>
                <li class="nav-item"><a href="#"><i class="fa-regular fa-heart"></i> <span>Notifications</span></a></li>
                <li class="nav-item"><a href="#"><i class="fa-regular fa-square-plus"></i> <span>Create</span></a></li>
                <li class="nav-item"><a href="#"><i class="fa-regular fa-user"></i> <span>Profile</span></a></li>
            </ul>
        </div>
        <ul class="nav-links">
            <li class="nav-item"><a href="#"><i class="fa-solid fa-bars"></i> <span>More</span></a></li>
        </ul>
    </nav>

    <!-- MAIN INTERFACE FEED -->
    <main class="main-container">
        <div class="feed-container">
            
            <!-- STORIES BAR -->
            <section class="stories-bar">
                <div class="story-card">
                    <div class="story-img-wrapper"><img src="https://picsum.photos" alt="avatar"></div>
                    <span class="story-username">your_story</span>
                </div>
                <div class="story-card">
                    <div class="story-img-wrapper"><img src="https://picsum.photos" alt="avatar"></div>
                    <span class="story-username">alex_travels</span>
                </div>
                <div class="story-card">
                    <div class="story-img-wrapper"><img src="https://picsum.photos" alt="avatar"></div>
                    <span class="story-username">code_craft</span>
                </div>
                <div class="story-card">
                    <div class="story-img-wrapper"><img src="https://picsum.photos" alt="avatar"></div>
                    <span class="story-username">design_hub</span>
                </div>
                <div class="story-card">
                    <div class="story-img-wrapper"><img src="https://picsum.photos" alt="avatar"></div>
                    <span class="story-username">nature_pics</span>
                </div>
            </section>

            <!-- POST FEED -->
            <section class="feed">
                
                <!-- Single Post Card -->
                <article class="post">
                    <div class="post-header">
